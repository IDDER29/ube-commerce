<article class="format-card">
  <a class="format-card__media" href="{{url}}" tabindex="-1" aria-hidden="true">
    <img src="assets/img/{{image}}" width="454" height="236" alt="" loading="lazy">
  </a>
  <div class="format-card__body">
    <h3 class="format-card__name"><a href="{{url}}">{{name}}</a></h3>
    <p class="format-card__size">{{size}}</p>
    <p class="format-card__price">{{price}}</p>
    <p class="format-card__tag{{tag_class}}">{{tag}}</p>
    <a class="btn btn--sm format-card__btn" href="{{url}}" aria-label="Choisir ce format : {{name}}">Choisir ce format</a>
  </div>
</article>
